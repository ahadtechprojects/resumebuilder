<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Resume & Portfolio Builder</title>
    <style>
      :root{--b:#0f172a;--t:#0b0f1a;--g:#e5e7eb;--c:#111827}
      *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:#f8fafc;color:#111827}
      .container{max-width:1120px;margin:auto;padding:24px}
      .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px}
      .btn{display:inline-flex;align-items:center;gap:8px;border:1px solid #e5e7eb;padding:10px 14px;border-radius:12px;background:#fff;cursor:pointer}
      .btn.primary{background:#111827;color:#fff;border-color:#111827}
      .input, select, textarea{width:100%;padding:10px 12px;border:1px solid #e5e7eb;border-radius:10px}
      .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
      .grid{display:grid;gap:16px}
      .muted{color:#6b7280;font-size:14px}
      .badge{display:inline-block;border:1px solid #e5e7eb;border-radius:999px;padding:4px 10px;font-size:12px}
      .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
      .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
      .link{color:#0ea5e9;text-decoration:none}
      @media (max-width:800px){.row{grid-template-columns:1fr}}
      @media print{.no-print{display:none}}
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <link rel="stylesheet" crossorigin href="/resumebuilder/assets/index-DB02a7PF.css">
  </head>
  <body>

  </body>
